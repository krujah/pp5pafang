<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบ ปพ.5</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#e3e6ee;--pri:#2457d6;--pri2:#e8efff;--ok:#0f8a5f;--bad:#c62828;--warn:#fff4d6}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0}
main{max-width:1100px;margin:16px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 12px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.dan{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center}
th{background:#f0f3fa;font-weight:600}
td.l,th.l{text-align:left}
.sc{overflow:auto;max-height:70vh}
.sc input{width:64px;text-align:center;padding:4px}
.sc input.bad{background:#ffe0e0;border-color:var(--bad)}
.sc input.dirty{background:var(--warn)}
.sticky{position:sticky;left:0;background:#fff;z-index:1}
.msg{padding:8px 12px;border-radius:8px;margin:8px 0;background:var(--pri2)}
.msg.err{background:#ffe3e3;color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.mute{color:var(--mute);font-size:14px}
.sub{cursor:pointer}.sub:hover{border-color:var(--pri)}
#login{max-width:360px;margin:12vh auto}
.hide{display:none!important}
#print{display:none}
th.sticky:first-child,td.sticky:first-child{min-width:42px}
td.ac:hover{background:#e8efff}
td.ac{user-select:none;min-width:26px}
select.ri,select.colfill,select.rowfill,select.pf,select.st{padding:3px 4px;font-size:14px}
details summary{cursor:pointer}
@media print{
  body{background:#fff}header,main{display:none!important}#pview button{display:none}
  #print{display:block;font-family:'TH Sarabun New','Sarabun',sans-serif;font-size:14pt}
  #print table th,#print table td{border:1px solid #000;padding:2px 4px}
  @page{size:A4 landscape;margin:12mm}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="login" class="card hide">
  <h2 id="loginTitle">เข้าสู่ระบบ ปพ.5</h2>
  <label>อีเมล</label><input id="lEmail" type="email" style="width:100%" autocomplete="username">
  <label>PIN</label><input id="lPin" type="password" inputmode="numeric" style="width:100%" autocomplete="current-password">
  <div id="lMsg"></div>
  <p><button class="pri" id="lBtn" style="width:100%">เข้าสู่ระบบ</button></p>
  <p style="text-align:center"><a href="#" id="toParent">สำหรับผู้ปกครอง ดูผลการเรียน</a></p>
</div>

<div id="plogin" class="card hide" style="max-width:360px;margin:12vh auto">
  <h2>ผู้ปกครอง · ดูผลการเรียน</h2>
  <label>รหัสนักเรียน (ชั้น-เลขที่ เช่น ป.5-12)</label><input id="pId" style="width:100%" placeholder="ป.5-12" autocomplete="off">
  <label>PIN 6 หลัก (จากใบที่โรงเรียนแจก)</label><input id="pPin" type="password" inputmode="numeric" style="width:100%" autocomplete="off">
  <div id="pMsg"></div>
  <p><button class="pri" id="pBtn" style="width:100%">ดูผลการเรียน</button></p>
  <p style="text-align:center"><a href="#" id="toTeacher">สำหรับครู</a></p>
</div>

<div id="pview" class="hide" style="max-width:820px;margin:0 auto;padding:16px"></div>

<header class="hide" id="hdr">
  <h1 id="hTitle">ระบบ ปพ.5</h1>
  <span id="hUser"></span>
  <button id="bHome">รายวิชา</button>
  <button id="bAdmin" class="hide">ผู้ดูแลระบบ</button>
  <button id="bPin">เปลี่ยน PIN</button>
  <button id="bOut">ออก</button>
</header>
<main id="main" class="hide"></main>
<div id="print"></div>

<script>
var S = { token: null, boot: null, cur: null, dirty: {} };
var $ = function (id) { return document.getElementById(id); };
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
// ====== ตั้งค่าตรงนี้ที่เดียว: วาง URL เว็บแอปของ Apps Script (ลงท้ายด้วย /exec) ======
var API_URL = 'https://script.google.com/macros/s/AKfycbw-MaTOIVijbqB7sua4eKszFMFdMFv0m-OSBD74uWezr3KXax6pYhzyNaKM-iciYetX/exec';
// =====================================================================
function api(fn){
  var args=[].slice.call(arguments,1);
  if(API_URL.indexOf('https://script.google.com/')!==0) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html'));
  return fetch(API_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
    .then(function(r){ if(!r.ok) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ('+r.status+')'); return r.json(); })
    .then(function(j){
      if(j.ok) return j.data;
      var m=j.error||'เกิดข้อผิดพลาด';
      if(m.indexOf('SESSION_EXPIRED')>=0){ doLogout(true); throw new Error('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่'); }
      throw new Error(m.replace(/^Error:\s*/,''));
    },function(e){ if(e instanceof TypeError) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตหรือ API_URL'); throw e; });
}
function note(el,text,err){ el.innerHTML='<div class="msg'+(err?' err':'')+'">'+esc(text)+'</div>'; }

/* ---- เกรด (ต้องตรงกับ gradeOf ใน Code.gs) ---- */
function gradeOf(p){ if(p==null||isNaN(p))return''; return p>=80?4:p>=75?3.5:p>=70?3:p>=65?2.5:p>=60?2:p>=55?1.5:p>=50?1:0; }
function calc(stu, d){
  var sd=0,md=0,sf=0,mf=0,filled=0;
  d.assessments.forEach(function(a){
    var v=d.scores[stu.studentId+'|'+a.id], mx=Number(a.max);
    if(a.type==='final'){ mf+=mx; if(v!==undefined&&v!==''){sf+=Number(v);filled++;} }
    else { md+=mx; if(v!==undefined&&v!==''){sd+=Number(v);filled++;} }
  });
  var rd=Number(d.subject.ratioDuring), rf=Number(d.subject.ratioFinal);
  var during = md? sd/md*rd : 0, fin = mf? sf/mf*rf : 0;
  if(!md) { /* ไม่มีช่องปลายปี/ระหว่างเรียน -> คิดเฉพาะที่มี */ }
  var total = during+fin;
  var full = (md?rd:0)+(mf?rf:0);
  var pct = full? total/full*100 : null;   // ถ้ามีครบทั้งสองส่วน full=100
  return { during:during, fin:fin, total:total, pct:filled?pct:null, grade: filled?gradeOf(pct):'' };
}
function r2(x){ return (Math.round(x*100)/100).toString(); }

/* ---- เข้าสู่ระบบ ---- */
function showLogin(){ $('login').classList.remove('hide'); $('plogin').classList.add('hide'); $('pview').classList.add('hide'); $('hdr').classList.add('hide'); $('main').classList.add('hide'); }
$('toParent').onclick=function(e){ e.preventDefault(); $('login').classList.add('hide'); $('plogin').classList.remove('hide'); };
$('toTeacher').onclick=function(e){ e.preventDefault(); showLogin(); };

/* ---- ผู้ปกครอง ---- */
$('pBtn').onclick=function(){
  $('pBtn').disabled=true;
  api('parentLogin',$('pId').value,$('pPin').value).then(function(r){ S.ptoken=r.token; return api('parentData',r.token); })
    .then(showParent).catch(function(e){ note($('pMsg'),e.message,true); }).then(function(){ $('pBtn').disabled=false; });
};
$('pPin').onkeydown=function(e){ if(e.key==='Enter') $('pBtn').click(); };
function showParent(d){
  $('plogin').classList.add('hide'); $('pview').classList.remove('hide'); $('pPin').value='';
  var st=d.student, h='<div class="card"><div class="row"><div style="flex:1"><h2 style="margin:0">'+esc(d.school)+'</h2><div>ผลการเรียนของ <b>'+esc(st.name)+'</b> · ชั้น'+esc(st.classLevel)+' เลขที่ '+esc(st.no)+'</div></div><button id="pPrint">พิมพ์ / PDF</button><button id="pOut">ออก</button></div></div>';
  if(!d.subjects.length) h+='<div class="card"><p class="mute">โรงเรียนยังไม่เปิดเผยผลการเรียนในขณะนี้</p></div>';
  var gs=0,gn=0;
  d.subjects.forEach(function(s){
    if(s.grade!==''){gs+=Number(s.grade);gn++;}
    h+='<div class="card"><div class="row"><b style="flex:1">'+esc(s.code)+' '+esc(s.name)+'</b><span class="mute">ภาคเรียน '+esc(s.term)+'/'+esc(s.year)+'</span></div><table style="margin-top:8px"><thead><tr><th class="l">รายการ</th><th>ประเภท</th><th>คะแนนเต็ม</th><th>ได้</th></tr></thead><tbody>';
    s.items.forEach(function(i){ h+='<tr><td class="l">'+esc(i.name)+'</td><td>'+(i.type==='final'?'ปลายปี':'ระหว่างเรียน')+'</td><td>'+esc(i.max)+'</td><td>'+esc(i.score)+'</td></tr>'; });
    h+='</tbody></table><p style="margin:8px 0 0">ระหว่างเรียน '+(s.grade===''?'-':r2(s.during))+'/'+esc(s.ratioDuring)+' · ปลายปี '+(s.grade===''?'-':r2(s.fin))+'/'+esc(s.ratioFinal)+' · รวม <b>'+(s.grade===''?'-':r2(s.total))+'</b> · เกรด <b style="font-size:20px;color:var(--pri)">'+(s.grade===''?'-':s.grade)+'</b></p></div>';
  });
  if(gn) h+='<div class="card">เกรดเฉลี่ยของรายวิชาที่แสดง (ไม่ถ่วงน้ำหนักหน่วยกิต): <b>'+r2(gs/gn)+'</b></div>';
  h+=parentCls(d);
  $('pview').innerHTML=h;
  $('pPrint').onclick=function(){ window.print(); };
  $('pOut').onclick=function(){ api('parentLogout',S.ptoken).catch(function(){}); S.ptoken=null; $('pview').classList.add('hide'); $('plogin').classList.remove('hide'); };
}
$('lBtn').onclick=function(){
  $('lBtn').disabled=true;
  api('login',$('lEmail').value,$('lPin').value).then(function(r){
    S.token=r.token; try{sessionStorage.setItem('pp5t',r.token);}catch(e){}
    return start();
  }).catch(function(e){ note($('lMsg'),e.message,true); }).then(function(){ $('lBtn').disabled=false; });
};
$('lPin').onkeydown=function(e){ if(e.key==='Enter') $('lBtn').click(); };
function doLogout(silent){
  if(!silent && S.token) api('logout',S.token).catch(function(){});
  S.token=null; try{sessionStorage.removeItem('pp5t');}catch(e){}
  showLogin();
}
$('bOut').onclick=function(){ doLogout(); };
$('bHome').onclick=function(){ home(); };
$('bAdmin').onclick=function(){ admin(); };
$('bPin').onclick=function(){
  var o=prompt('PIN เดิม'); if(o==null)return; var n=prompt('PIN ใหม่ (ตัวเลข 4–8 หลัก)'); if(n==null)return;
  api('changePin',S.token,o,n).then(function(){alert('เปลี่ยน PIN แล้ว');}).catch(function(e){alert(e.message);});
};

function start(){
  return api('bootstrap',S.token).then(function(b){
    S.boot=b;
    $('login').classList.add('hide'); $('hdr').classList.remove('hide'); $('main').classList.remove('hide');
    $('hTitle').textContent=b.school+' · ระบบ ปพ.5 ปีการศึกษา '+b.year;
    $('hUser').textContent=b.user.name;
    $('bAdmin').classList.toggle('hide',b.user.role!=='admin');
    home();
  });
}

/* ---- หน้ารายวิชา ---- */
function home(){
  var b=S.boot, h=classCards()+'<div class="card"><h2>รายวิชาของฉัน</h2>';
  if(!b.subjects.length) h+='<p class="mute">ยังไม่มีรายวิชาที่มอบหมายให้ — ติดต่อผู้ดูแลระบบ</p>';
  var by={}; b.subjects.forEach(function(s){(by[s.classLevel]=by[s.classLevel]||[]).push(s);});
  Object.keys(by).sort().forEach(function(c){
    h+='<h3 style="margin:14px 0 6px">'+esc(c)+'</h3><div class="grid2">';
    by[c].forEach(function(s){
      h+='<div class="card sub" data-k="'+esc(s.key)+'" style="margin:0"><b>'+esc(s.code)+' '+esc(s.name)+'</b><div class="mute">ภาคเรียน '+esc(s.term)+'/'+esc(s.year)+' · ระหว่างเรียน:ปลายปี '+esc(s.ratioDuring)+':'+esc(s.ratioFinal)+'</div></div>';
    });
    h+='</div>';
  });
  $('main').innerHTML=h+'</div>';
  bindClassCards();
  [].forEach.call(document.querySelectorAll('.sub'),function(el){ el.onclick=function(){ openSubject(el.dataset.k); }; });
}

/* ---- กรอกคะแนน ---- */
function openSubject(key){
  $('main').innerHTML='<div class="card">กำลังโหลด...</div>';
  api('getSubjectData',S.token,key).then(function(d){ S.cur=d; S.dirty={}; S.stDirty={}; S.tab='scores'; renderSubject(); })
    .catch(function(e){ $('main').innerHTML='<div class="card"><div class="msg err">'+esc(e.message)+'</div></div>'; });
}
function renderSubject(){
  var d=S.cur, s=d.subject;
  var h='<div class="card"><div class="row"><div style="flex:1"><h2 style="margin:0">'+esc(s.code)+' '+esc(s.name)+' · '+esc(s.classLevel)+'</h2>'
   +'<div class="mute">ภาคเรียนที่ '+esc(s.term)+' ปีการศึกษา '+esc(s.year)+' · ระหว่างเรียน:ปลายปี = '+esc(s.ratioDuring)+':'+esc(s.ratioFinal)+'</div></div>'
   +'<button id="bSave" class="pri">บันทึกคะแนน</button><button id="bPrint">พิมพ์ ปพ.5</button><button id="bCover">พิมพ์ปก ปพ.5</button><button id="bRel"></button></div>'
   +'<div id="sMsg"></div>'
   +'<div class="tabs"><button data-t="scores">กรอกคะแนน</button><button data-t="setup">ตั้งช่องคะแนน</button><button data-t="sum">สรุปเกรด</button></div><div id="tab"></div></div>';
  $('main').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.classList.toggle('on',b.dataset.t===S.tab); b.onclick=function(){S.tab=b.dataset.t;renderSubject();}; });
  $('bSave').onclick=saveScores;
  $('bPrint').onclick=printPP5;
  $('bCover').onclick=printCover;
  var rel=function(){ var v=s.released===true||String(s.released).toUpperCase()==='TRUE'; $('bRel').textContent=v?'ผู้ปกครองเห็นผลวิชานี้แล้ว (กดเพื่อปิด)':'เปิดให้ผู้ปกครองดูผล'; $('bRel').className=v?'pri':''; return v; };
  rel();
  $('bRel').onclick=function(){
    var now=rel(); if(!now && !confirm('เปิดให้ผู้ปกครองของนักเรียนทุกคนในชั้นนี้เห็นคะแนนและเกรดวิชานี้?')) return;
    api('setReleased',S.token,s.key,!now).then(function(v){ s.released=v; rel(); note($('sMsg'),v?'เปิดให้ผู้ปกครองดูผลแล้ว':'ปิดการแสดงผลแล้ว'); }).catch(function(e){ note($('sMsg'),e.message,true); });
  };
  if(S.tab==='scores') tabScores(); else if(S.tab==='setup') tabSetup(); else tabSum();
}
/* ---- ตั้งช่องคะแนน ---- */
function tabSetup(){
  if(S.cur.subject.kind==='pass'){ $('tab').innerHTML='<p class="mute">รายวิชานี้ประเมินผลเป็น ผ่าน/ไม่ผ่าน (ผ/มผ) ไม่ต้องตั้งช่องคะแนน — ไปที่แท็บ "กรอกคะแนน" เพื่อเลือกผลของนักเรียน</p>'; return; }
  var d=S.cur, h='<p class="mute">เพิ่มช่องคะแนนระหว่างเรียน (เช่น ตัวชี้วัด/หน่วย/ชิ้นงาน) และช่องคะแนนปลายปี/ปลายภาค ระบบจะปรับสัดส่วนให้เป็น '+esc(d.subject.ratioDuring)+':'+esc(d.subject.ratioFinal)+' อัตโนมัติ</p>'
   +'<table id="asT"><thead><tr><th>ชื่อช่อง</th><th>ประเภท</th><th>คะแนนเต็ม</th><th></th></tr></thead><tbody></tbody></table>'
   +'<p class="row"><button id="aAddD">+ ระหว่างเรียน</button><button id="aAddF">+ ปลายปี</button><button class="pri" id="aSave">บันทึกช่องคะแนน</button></p>'
   +'<div class="msg">คำเตือน: การลบช่องจะลบคะแนนของช่องนั้นด้วย</div>';
  $('tab').innerHTML=h;
  function addRow(a){
    var tr=document.createElement('tr'); tr.dataset.id=a.id||'';
    tr.innerHTML='<td><input class="n" value="'+esc(a.name)+'"></td><td><select class="t"><option value="during"'+(a.type!=='final'?' selected':'')+'>ระหว่างเรียน</option><option value="final"'+(a.type==='final'?' selected':'')+'>ปลายปี</option></select></td><td><input class="m" style="width:80px" value="'+esc(a.max)+'"></td><td><button class="dan">ลบ</button></td>';
    tr.querySelector('button').onclick=function(){tr.remove();};
    $('asT').tBodies[0].appendChild(tr);
  }
  d.assessments.forEach(addRow);
  $('aAddD').onclick=function(){ addRow({name:'ตัวชี้วัด '+($('asT').tBodies[0].rows.length+1),type:'during',max:10}); };
  $('aAddF').onclick=function(){ addRow({name:'สอบปลายปี',type:'final',max:100}); };
  $('aSave').onclick=function(){
    var list=[].map.call($('asT').tBodies[0].rows,function(tr){ return {id:tr.dataset.id,name:tr.querySelector('.n').value,type:tr.querySelector('.t').value,max:tr.querySelector('.m').value}; });
    api('saveAssessments',S.token,d.subject.key,list).then(function(clean){
      d.assessments=clean; var ids={}; clean.forEach(function(a){ids[a.id]=1;});
      Object.keys(d.scores).forEach(function(k){ if(!ids[k.split('|')[1]]) delete d.scores[k]; });
      note($('sMsg'),'บันทึกช่องคะแนนแล้ว'); S.tab='scores'; renderSubject();
    }).catch(function(e){ note($('sMsg'),e.message,true); });
  };
}

/* ---- ผู้ดูแลระบบ ---- */
function admin(){
  $('main').innerHTML='<div class="card">กำลังโหลด...</div>';
  api('adminGetAll',S.token).then(function(a){ S.adm=a; S.atab=S.atab||'subjects'; renderAdmin(); })
   .catch(function(e){ $('main').innerHTML='<div class="card"><div class="msg err">'+esc(e.message)+'</div></div>'; });
}
function renderAdmin(){
  $('main').innerHTML='<div class="card"><h2>ผู้ดูแลระบบ</h2><div class="tabs">'
   +[['subjects','รายวิชา'],['students','นักเรียน'],['users','ครู/ผู้ใช้'],['classes','ครูประจำชั้น'],['pins','PIN ผู้ปกครอง'],['cfg','ตั้งค่าโรงเรียน']].map(function(t){return '<button data-t="'+t[0]+'"'+(S.atab===t[0]?' class="on"':'')+'>'+t[1]+'</button>';}).join('')
   +'</div><div id="aMsg"></div><div id="atab"></div></div>';

/* ---- นำเข้านักเรียนจากไฟล์ (Excel/CSV) ---- */
function colLetter(i){ var s=''; i++; while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function detectMap(aoa){
  var hdr=-1, i, j;
  for(i=0;i<Math.min(aoa.length,15)&&hdr<0;i++){ for(j=0;j<aoa[i].length;j++){ if(/^(ชื่อ|ชื่อ(และ|-)?(นามสกุล|สกุล)|ชื่อนักเรียน|ชื่อตัว|ชื่อ-ชื่อสกุล)$/.test(String(aoa[i][j]).replace(/\s+/g,''))){ hdr=i; break; } } }
  var heads=[], ncol=0; aoa.forEach(function(r){ ncol=Math.max(ncol,r.length); });
  for(j=0;j<ncol;j++) heads.push(hdr>=0 && String(aoa[hdr][j]||'').trim() ? String(aoa[hdr][j]).trim() : 'คอลัมน์ '+colLetter(j));
  var m={no:-1,title:-1,first:-1,last:-1,full:-1};
  heads.forEach(function(h,k){
    var t=h.replace(/\s+/g,'');
    if(m.no<0 && /^(เลขที่|ที่|ลำดับ|no\.?)$/i.test(t)) m.no=k;
    else if(m.title<0 && /คำนำหน้า/.test(t)) m.title=k;
    else if(m.full<0 && /ชื่อ[-–]?(และ)?สกุล|ชื่อ-นามสกุล|ชื่อนามสกุล/.test(t)) m.full=k;
    else if(m.last<0 && /สกุล/.test(t)) m.last=k;
    else if(m.first<0 && /^ชื่อ(ตัว|นักเรียน)?$/.test(t)) m.first=k;
  });
  if(m.full<0 && m.first<0){   // ไม่มีหัวคอลัมน์ชัด: เลือกคอลัมน์แรกที่เป็นข้อความไทยยาว
    for(j=0;j<ncol;j++){ var ok=0,n=0; for(i=hdr+1;i<aoa.length;i++){ var v=String(aoa[i][j]||'').trim(); if(v){ n++; if(/[ก-๙]/.test(v)&&v.length>=5) ok++; } } if(n&&ok/n>0.6){ m.full=j; break; } }
  }
  return {hdr:hdr, heads:heads, map:m};
}
function extractRows(aoa, hdr, m, classLevel){
  var out=[], seq=0;
  for(var i=hdr+1;i<aoa.length;i++){
    var r=aoa[i], g=function(k){ return k>=0 ? String(r[k]==null?'':r[k]).trim() : ''; };
    var name = m.full>=0 ? g(m.full) : (g(m.title)+g(m.first)+' '+g(m.last));
    name=name.replace(/\s+/g,' ').trim();
    if(!name) continue;
    seq++; var no=Number(g(m.no)); if(!(no>0)) no=seq;
    out.push({classLevel:classLevel, no:no, name:name});
  }
  return out;
}
function readTextFile(file){
  return file.arrayBuffer().then(function(buf){
    try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
    catch(e){ return new TextDecoder('windows-874').decode(buf); }   // CSV จาก Excel ภาษาไทยรุ่นเก่า
  });
}

var RATE_FRAC = 0.6;
function rateOverall(arr, n){
  if(arr.length < n) return '';
  for(var i=0;i<n;i++) if(arr[i]===''||arr[i]==null) return '';
  var min = Math.min.apply(null, arr); if(min < 1) return 0;
  var need = Math.ceil(n*RATE_FRAC), c3 = arr.filter(function(v){return v>=3;}).length, c2 = arr.filter(function(v){return v>=2;}).length;
  if(c3>=need && min>=2) return 3; if(c2>=need) return 2; return 1;
}

function monthCounts(marks, days){ var o={m:0,p:0,l:0,k:0}; for(var i=0;i<31;i++){ if(days.charAt(i)!=='1') continue; var ch=(marks||'').charAt(i); if(ch==='ม')o.m++; else if(ch==='ป')o.p++; else if(ch==='ล')o.l++; else if(ch==='ข')o.k++; } return o; }
function attStats(term){   // term: '1' | '2' | 'all'
  var d = C.att, months = d.months.filter(function(m){ return term==='all' || m.term===term; }), days = 0, per = {};
  var withData = months.filter(function(m){ return d.students.some(function(s){ var mk=d.marks[s.studentId+'|'+m.ym]; return mk && /[^-]/.test(mk); }); });
  withData.forEach(function(m){ for(var i=0;i<31;i++) if(m.days.charAt(i)==='1') days++; });
  d.students.forEach(function(s){
    var o={m:0,p:0,l:0,k:0,pct:''};
    withData.forEach(function(m){ var c=monthCounts(d.marks[s.studentId+'|'+m.ym], m.days); o.m+=c.m; o.p+=c.p; o.l+=c.l; o.k+=c.k; });
    if(days && (o.m+o.p+o.l+o.k)>0) o.pct = Math.round(o.m/days*1000)/10;
    per[s.studentId]=o;
  });
  return {days:days, per:per};
}

  };

function normDate(v){
  v = String(v).trim(); if(!v) return '';
  var m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m){ var y=Number(m[1]); if(y>2400) y-=543; return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2); }
  m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m){ var y2=Number(m[3]); if(y2>2400) y2-=543; return y2+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2); }
  return v;
}

function resultOfStudent(stu, d){
  var stt = d.status && d.status[stu.studentId];

  if(d.subject.kind === 'pass'){ var v = d.scores[stu.studentId+'|_pf']; return {grade: v===undefined?'':(v===1?'ผ':'มผ'), total:null}; }
  var c = calc(stu, d); return {grade: c.grade, total: c.pct==null?null:c.total, c:c, pct:c.pct};
}
function refreshRow(tr){
  var st = S.cur.students.filter(function(s){ return s.studentId === tr.dataset.s; })[0], r = resultOfStudent(st, S.cur);
  if(!isPass()){ var c = r.c || calc(st, S.cur), ok = c.pct != null && !r.special;
    tr.querySelector('.c-d').textContent = c.pct==null?'':r2(c.during); tr.querySelector('.c-f').textContent = c.pct==null?'':r2(c.fin);
    tr.querySelector('.c-t b').textContent = c.pct==null?'':r2(c.total); }

    + (c.gpa!==''?'<p>เกรดเฉลี่ยจากรายวิชาที่เปิดแสดง (ถ่วงน้ำหนักตามชั่วโมง): <b style="font-size:20px;color:var(--pri)">'+c.gpa+'</b>'+(c.rank!==''?' · อันดับที่ <b>'+c.rank+'</b> จาก '+c.classSize+' คน':'')+'</p>':'')+'</div>';
  var T = c.traits, L = function(k){ var o = T[k].overall; return o===''?'-':o; };
  h += '<div class="card"><h2>คุณลักษณะและกิจกรรม</h2><table><tbody><tr><td class="l">คุณลักษณะอันพึงประสงค์</td><td><b>'+esc(L('trait'))+'</b></td></tr><tr><td class="l">การอ่าน คิดวิเคราะห์ และเขียน</td><td><b>'+esc(L('read'))+'</b></td></tr><tr><td class="l">ค่านิยมหลัก 12 ประการ</td><td><b>'+esc(L('value'))+'</b></td></tr><tr><td class="l">สมรรถนะสำคัญของผู้เรียน</td><td><b>'+esc(L('comp'))+'</b></td></tr>'
    + c.actNames.map(function(n,i){ var v = (T.act.overall||[])[i]; return '<tr><td class="l">กิจกรรม: '+esc(n)+'</td><td><b>'+(v||'-')+'</b></td></tr>'; }).join('') + '</tbody></table></div>';
  if(c.health && c.health.length){
    h += '<div class="card"><h2>น้ำหนัก-ส่วนสูง</h2><table><thead><tr><th>ภาค/ครั้ง</th><th>วันที่</th><th>น้ำหนัก (กก.)</th><th>ส่วนสูง (ซม.)</th><th>น้ำหนัก/อายุ</th><th>ส่วนสูง/อายุ</th><th>น้ำหนัก/ส่วนสูง</th></tr></thead><tbody>'
      + c.health.map(function(x){ return '<tr><td>'+esc(x.term)+'/'+esc(x.round)+'</td><td>'+esc(thDate(x.date))+'</td><td>'+esc(nz(x.weight))+'</td><td>'+esc(nz(x.height))+'</td><td>'+esc(x.wa)+'</td><td>'+esc(x.ha)+'</td><td>'+esc(x.wh)+'</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  return h;
}

/* ================= ผู้ดูแล: ครูประจำชั้น ================= */
function aClasses(){
  var a = S.adm, teachers = a.users.filter(function(u){ return u.active !== false && u.active !== 'FALSE'; });
  var opts = '<option value="">— ไม่ระบุ —</option>' + teachers.map(function(u){ return '<option value="'+esc(u.email)+'">'+esc(u.name)+'</option>'; }).join('');
  var h = '<p class="mute">กำหนดครูประจำชั้น (ได้สูงสุด 2 คนต่อห้อง) — ครูประจำชั้นจะเห็นเมนู "ห้องประจำชั้น" เพื่อบันทึกเวลาเรียน น้ำหนัก-ส่วนสูง คุณลักษณะ ค่านิยม กิจกรรม ข้อมูลนักเรียน และพิมพ์ ปพ.6 · ปีการศึกษา '+esc(a.config.year)+'</p><table style="max-width:640px"><thead><tr><th>ชั้น</th><th class="l">ครูประจำชั้น 1</th><th class="l">ครูประจำชั้น 2</th><th></th></tr></thead><tbody>';
  S.boot.classes.forEach(function(c){ h += '<tr data-c="'+esc(c)+'"><td>'+esc(c)+'</td><td><select class="t1">'+opts+'</select></td><td><select class="t2">'+opts+'</select></td><td><button class="pri">บันทึก</button></td></tr>'; });
  $('atab').innerHTML = h + '</tbody></table>';
  [].forEach.call($('atab').querySelectorAll('tbody tr'), function(tr){
    var cur = (a.classTeachers || []).filter(function(r){ return r.classLevel === tr.dataset.c; }).map(function(r){ return String(r.email).toLowerCase(); });
    tr.querySelector('.t1').value = cur[0] || ''; tr.querySelector('.t2').value = cur[1] || '';
    tr.querySelector('button').onclick = function(){ api('adminSaveClassTeachers', S.token, tr.dataset.c, [tr.querySelector('.t1').value, tr.querySelector('.t2').value]).then(function(){ return aDone('บันทึกครูประจำชั้น '+tr.dataset.c+' แล้ว'); }).catch(aErr); };
  });
}
