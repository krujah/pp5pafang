<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบ ปพ.5</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'PSKUI';src:local('TH Sarabun PSK'),local('THSarabunPSK'),local('TH SarabunPSK');size-adjust:120%}
@font-face{font-family:'PSKUI';font-weight:700;src:local('TH Sarabun PSK Bold'),local('THSarabunPSK-Bold');size-adjust:120%}
button,input,select,textarea{font-family:inherit}

:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#e3e6ee;--pri:#2457d6;--pri2:#e8efff;--ok:#0f8a5f;--bad:#c62828;--warn:#fff4d6}
*{box-sizing:border-box}
body{margin:0;font-family:'PSKUI','TH Sarabun PSK','THSarabunPSK','Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0}
main{max-width:1100px;margin:16px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 12px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.dan{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center}
th{background:#f0f3fa;font-weight:600}
td.l,th.l{text-align:left}
.sc{overflow:auto;max-height:70vh}
.sc input{width:64px;text-align:center;padding:4px}
.sc input.bad{background:#ffe0e0;border-color:var(--bad)}
.sc input.dirty{background:var(--warn)}
.sticky{position:sticky;left:0;background:#fff;z-index:1}
.msg{padding:8px 12px;border-radius:8px;margin:8px 0;background:var(--pri2)}
.msg.err{background:#ffe3e3;color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.mute{color:var(--mute);font-size:14px}
.sub{cursor:pointer}.sub:hover{border-color:var(--pri)}
#login{max-width:360px;margin:12vh auto}
.hide{display:none!important}
#print{display:none}
th.sticky:first-child,td.sticky:first-child{min-width:42px}
#bkView table th,#bkView table td{border:1px solid #999;padding:2px 4px;font-size:13px}
.bkpg{border:1px solid var(--line);background:#fff;padding:12px;margin:10px 0;overflow:auto;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.bkland{max-width:1000px}.bkport{max-width:720px}
td.ac:hover{background:#e8efff}

.card.wb{background:#ffe6f8;border-color:#e9a8d6}
.card.wb table{border-collapse:collapse}
.card.wb td,.card.wb th{border:1px solid #8a8a8a}
.card.wb td{background:#fff}.card.wb th{background:#f7d0ec}
.card.wb td.sticky,.card.wb th.sticky{background:#f7d0ec}
.card.wb .tabs button.on{background:#107c41;color:#fff;border-color:#107c41}
.wbbar{position:sticky;top:0;background:#fff;border:1px solid #cfd6e4;border-radius:14px;margin:0 0 10px;z-index:8;padding:10px;box-shadow:0 2px 8px rgba(20,40,90,.12)}
.wbrow{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 8px}
.wbrow button{border:2px solid #2457d6;background:#eef3ff;color:#1b3f9e;font-size:15px;font-weight:600;padding:9px 15px;border-radius:12px;white-space:nowrap;cursor:pointer;transition:transform .08s,box-shadow .12s}
.wbrow button:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(36,87,214,.25)}
.wbrow button[data-g="h"]{border-color:#7a4cc2;background:#f3ecff;color:#5a2fa0}
.wbrow button[data-g="s"]{border-color:#c9741a;background:#fff3e3;color:#8a4a0a}
.wbrow button.on{background:#2457d6;color:#fff;box-shadow:0 3px 10px rgba(36,87,214,.35)}
.wbrow button[data-g="s"].on{background:#d9822b;border-color:#d9822b;color:#fff;box-shadow:0 3px 10px rgba(217,130,43,.35)}
.wbtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed #cfd6e4;padding-top:8px}
.wbtools .wbp{font-size:15px;font-weight:600;padding:9px 16px;border-radius:12px;background:#107c41;color:#fff;border:2px solid #107c41}
.wbtools select{font-size:15px;padding:8px;border-radius:10px;border:2px solid #c9741a;background:#fff}
.xl input.xc.rng{background:#cfe3ff !important}
td.ac.sel{outline:2px solid #1a73e8;outline-offset:-2px}
td.ac{user-select:none;min-width:26px}
select.ri,select.colfill,select.rowfill,select.pf,select.st{padding:3px 4px;font-size:14px}
details summary{cursor:pointer}
@media print{
  body{background:#fff}header,main{display:none!important}#pview button{display:none}
  #print{display:block;font-family:'TH Sarabun PSK','THSarabunPSK','Sarabun',sans-serif;font-size:16pt}
  #print table th,#print table td{border:1px solid #000;padding:2px 4px}
  @page{size:A4 portrait;margin:10mm}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="login" class="card hide">
  <h2 id="loginTitle">เข้าสู่ระบบ ปพ.5</h2>
  <label>อีเมล</label><input id="lEmail" type="email" style="width:100%" autocomplete="username">
  <label>PIN</label><input id="lPin" type="password" inputmode="numeric" style="width:100%" autocomplete="current-password">
  <div id="lMsg"></div>
  <p><button class="pri" id="lBtn" style="width:100%">เข้าสู่ระบบ</button></p>
  <p style="text-align:center"><a href="#" id="toParent">สำหรับผู้ปกครอง ดูผลการเรียน</a></p>
</div>

<div id="plogin" class="card hide" style="max-width:360px;margin:12vh auto">
  <h2>ผู้ปกครอง · ดูผลการเรียน</h2>
  <label>รหัสนักเรียน (ชั้น-เลขที่ เช่น ป.5-12)</label><input id="pId" style="width:100%" placeholder="ป.5-12" autocomplete="off">
  <label>PIN 6 หลัก (จากใบที่โรงเรียนแจก)</label><input id="pPin" type="password" inputmode="numeric" style="width:100%" autocomplete="off">
  <div id="pMsg"></div>
  <p><button class="pri" id="pBtn" style="width:100%">ดูผลการเรียน</button></p>
  <p style="text-align:center"><a href="#" id="toTeacher">สำหรับครู</a></p>
</div>

<div id="pview" class="hide" style="max-width:820px;margin:0 auto;padding:16px"></div>

<header class="hide" id="hdr">
  <h1 id="hTitle">ระบบ ปพ.5</h1>
  <span id="hUser"></span>
  <button id="bHome">รายวิชา</button>
  <button id="bAdmin" class="hide">ผู้ดูแลระบบ</button>
  <button id="bPin">เปลี่ยน PIN</button>
  <button id="bOut">ออก</button>
</header>
<main id="main" class="hide"></main>
<div id="print"></div>

<script>
var S = { token: null, boot: null, cur: null, dirty: {} };
var $ = function (id) { return document.getElementById(id); };
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
// ====== ตั้งค่าตรงนี้ที่เดียว: วาง URL เว็บแอปของ Apps Script (ลงท้ายด้วย /exec) ======
var API_URL = 'https://script.google.com/macros/s/AKfycbw-MaTOIVijbqB7sua4eKszFMFdMFv0m-OSBD74uWezr3KXax6pYhzyNaKM-iciYetX/exec';
// =====================================================================
function api(fn){
  var args=[].slice.call(arguments,1);
  if(API_URL.indexOf('https://script.google.com/')!==0) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html'));
  return fetch(API_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
    .then(function(r){ if(!r.ok) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ('+r.status+')'); return r.json(); })
    .then(function(j){
      if(j.ok) return j.data;
      var m=j.error||'เกิดข้อผิดพลาด';
      if(m.indexOf('SESSION_EXPIRED')>=0){ doLogout(true); throw new Error('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่'); }
      throw new Error(m.replace(/^Error:\s*/,''));
    },function(e){ if(e instanceof TypeError) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตหรือ API_URL'); throw e; });
}
function note(el,text,err){ el.innerHTML='<div class="msg'+(err?' err':'')+'">'+esc(text)+'</div>'; }

/* ---- เกรด (ต้องตรงกับ gradeOf ใน Code.gs) ---- */
function gradeOf(p){ if(p==null||isNaN(p))return''; return p>=80?4:p>=75?3.5:p>=70?3:p>=65?2.5:p>=60?2:p>=55?1.5:p>=50?1:0; }
function calc(stu, d){
  var sd=0,md=0,sf=0,mf=0,sc=0,mc=0,filled=0;
  d.assessments.forEach(function(a){
    var v=d.scores[stu.studentId+'|'+a.id], mx=Number(a.max), has=(v!==undefined&&v!=='');
    if(a.type==='final'){ mf+=mx; if(has){sf+=Number(v);filled++;} }
    else if(a.type==='central'){ mc+=mx; if(has){sc+=Number(v);filled++;} }
    else { md+=mx; if(has){sd+=Number(v);filled++;} }
  });
  var rd=Number(d.subject.ratioDuring), rf=Number(d.subject.ratioFinal), cp=(Number(d.subject.centralPct)||0)/100;
  var finFrac=null;
  if(cp>0&&mc>0) finFrac=(mf?sf/mf*(1-cp):0)+sc/mc*cp; else if(mf) finFrac=sf/mf;
  var during=md?sd/md*rd:0, fin=finFrac===null?0:finFrac*rf;
  var full=(md?rd:0)+(finFrac===null?0:rf), total=during+fin, pct=full?total/full*100:null;
  return { during:during, fin:fin, total:total, pct:filled?pct:null, grade: filled?gradeOf(pct):'' };
}
function r2(x){ return (Math.round(x*100)/100).toString(); }

/* ---- เข้าสู่ระบบ ---- */
function showLogin(){ $('login').classList.remove('hide'); $('plogin').classList.add('hide'); $('pview').classList.add('hide'); $('hdr').classList.add('hide'); $('main').classList.add('hide'); }
$('toParent').onclick=function(e){ e.preventDefault(); $('login').classList.add('hide'); $('plogin').classList.remove('hide'); };
$('toTeacher').onclick=function(e){ e.preventDefault(); showLogin(); };

/* ---- ผู้ปกครอง ---- */
$('pBtn').onclick=function(){
  $('pBtn').disabled=true;
  api('parentLogin',$('pId').value,$('pPin').value).then(function(r){ S.ptoken=r.token; return api('parentData',r.token); })
    .then(showParent).catch(function(e){ note($('pMsg'),e.message,true); }).then(function(){ $('pBtn').disabled=false; });
};
$('pPin').onkeydown=function(e){ if(e.key==='Enter') $('pBtn').click(); };
function showParent(d){
  $('plogin').classList.add('hide'); $('pview').classList.remove('hide'); $('pPin').value='';
  var st=d.student, h='<div class="card"><div class="row"><div style="flex:1"><h2 style="margin:0">'+esc(d.school)+'</h2><div>ผลการเรียนของ <b>'+esc(st.name)+'</b> · ชั้น'+esc(st.classLevel)+' เลขที่ '+esc(st.no)+'</div></div><button id="pPrint">พิมพ์ / PDF</button><button id="pOut">ออก</button></div></div>';
  if(!d.subjects.length) h+='<div class="card"><p class="mute">โรงเรียนยังไม่เปิดเผยผลการเรียนในขณะนี้</p></div>';
  var gs=0,gn=0;
  d.subjects.forEach(function(s){
    if(s.grade!==''){gs+=Number(s.grade);gn++;}
    h+='<div class="card"><div class="row"><b style="flex:1">'+esc(s.code)+' '+esc(s.name)+'</b><span class="mute">ภาคเรียน '+esc(s.term)+'/'+esc(s.year)+'</span></div><table style="margin-top:8px"><thead><tr><th class="l">รายการ</th><th>ประเภท</th><th>คะแนนเต็ม</th><th>ได้</th></tr></thead><tbody>';
    s.items.forEach(function(i){ h+='<tr><td class="l">'+esc(i.name)+'</td><td>'+(i.type==='final'?'ปลายปี':'ระหว่างเรียน')+'</td><td>'+esc(i.max)+'</td><td>'+esc(i.score)+'</td></tr>'; });
    h+='</tbody></table><p style="margin:8px 0 0">ระหว่างเรียน '+(s.grade===''?'-':r2(s.during))+'/'+esc(s.ratioDuring)+' · ปลายปี '+(s.grade===''?'-':r2(s.fin))+'/'+esc(s.ratioFinal)+' · รวม <b>'+(s.grade===''?'-':r2(s.total))+'</b> · เกรด <b style="font-size:20px;color:var(--pri)">'+(s.grade===''?'-':s.grade)+'</b></p></div>';
  });
  if(gn) h+='<div class="card">เกรดเฉลี่ยของรายวิชาที่แสดง (ไม่ถ่วงน้ำหนักหน่วยกิต): <b>'+r2(gs/gn)+'</b></div>';
  h+=parentCls(d);
  $('pview').innerHTML=h;
  $('pPrint').onclick=function(){ window.print(); };
  $('pOut').onclick=function(){ api('parentLogout',S.ptoken).catch(function(){}); S.ptoken=null; $('pview').classList.add('hide'); $('plogin').classList.remove('hide'); };
}
$('lBtn').onclick=function(){
  $('lBtn').disabled=true;
  api('login',$('lEmail').value,$('lPin').value).then(function(r){
    S.token=r.token; try{sessionStorage.setItem('pp5t',r.token);}catch(e){}
    return start();
  }).catch(function(e){ note($('lMsg'),e.message,true); }).then(function(){ $('lBtn').disabled=false; });
};
$('lPin').onkeydown=function(e){ if(e.key==='Enter') $('lBtn').click(); };
function doLogout(silent){
  if(!silent && S.token) api('logout',S.token).catch(function(){});
  S.token=null; try{sessionStorage.removeItem('pp5t');}catch(e){}
  showLogin();
}
$('bOut').onclick=function(){ doLogout(); };
$('bHome').onclick=function(){ home(); };
$('bAdmin').onclick=function(){ admin(); };
$('bPin').onclick=function(){
  var o=prompt('PIN เดิม'); if(o==null)return; var n=prompt('PIN ใหม่ (ตัวเลข 4–8 หลัก)'); if(n==null)return;
  api('changePin',S.token,o,n).then(function(){alert('เปลี่ยน PIN แล้ว');}).catch(function(e){alert(e.message);});
};

function start(){
  return api('bootstrap',S.token).then(function(b){
    S.boot=b;
    $('login').classList.add('hide'); $('hdr').classList.remove('hide'); $('main').classList.remove('hide');
    $('hTitle').textContent=b.school+' · ระบบ ปพ.5 ปีการศึกษา '+b.year;
    $('hUser').textContent=b.user.name;
    $('bAdmin').classList.toggle('hide',b.user.role!=='admin');
    home();
  });
}

/* ---- หน้ารายวิชา ---- */
function home(){
  var b=S.boot, h=classCards()+'<div class="card"><h2>รายวิชาของฉัน</h2>';
  if(!b.subjects.length) h+='<p class="mute">ยังไม่มีรายวิชาที่มอบหมายให้ — ติดต่อผู้ดูแลระบบ</p>';
  var by={}; b.subjects.forEach(function(s){(by[s.classLevel]=by[s.classLevel]||[]).push(s);});
  Object.keys(by).sort().forEach(function(c){
    h+='<h3 style="margin:14px 0 6px">'+esc(c)+'</h3><div class="grid2">';
    by[c].forEach(function(s){
      h+='<div class="card sub" data-k="'+esc(s.key)+'" style="margin:0"><b>'+esc(s.code)+' '+esc(s.name)+'</b><div class="mute">ภาคเรียน '+esc(s.term)+'/'+esc(s.year)+' · ระหว่างเรียน:ปลายปี '+esc(s.ratioDuring)+':'+esc(s.ratioFinal)+'</div></div>';
    });
    h+='</div>';
  });
  $('main').innerHTML=h+'</div>';
  bindClassCards();
  [].forEach.call(document.querySelectorAll('.sub'),function(el){ el.onclick=function(){ openSubject(el.dataset.k); }; });
}

/* ---- กรอกคะแนน ---- */
function openSubject(key){
  $('main').innerHTML='<div class="card">กำลังโหลด...</div>';
  api('getSubjectData',S.token,key).then(function(d){ S.cur=d; S.dirty={}; S.stDirty={}; S.tab='scores'; renderSubject(); })
    .catch(function(e){ $('main').innerHTML='<div class="card"><div class="msg err">'+esc(e.message)+'</div></div>'; });
}
function renderSubject(){
  var d=S.cur, s=d.subject;
  var h='<div class="card"><div class="row"><div style="flex:1"><h2 style="margin:0">'+esc(s.code)+' '+esc(s.name)+' · '+esc(s.classLevel)+'</h2>'
   +'<div class="mute">ภาคเรียนที่ '+esc(s.term)+' ปีการศึกษา '+esc(s.year)+' · ระหว่างเรียน:ปลายปี = '+esc(s.ratioDuring)+':'+esc(s.ratioFinal)+'</div></div>'
   +'<button id="bSave" class="pri">บันทึกคะแนน</button><button id="bPrint">พิมพ์ ปพ.5</button><button id="bCover">พิมพ์ปก ปพ.5</button><button id="bRel"></button></div>'
   +'<div id="sMsg"></div>'
   +'<div class="tabs"><button data-t="scores">กรอกคะแนน</button><button data-t="setup">ตั้งช่องคะแนน</button><button data-t="sum">สรุปเกรด</button></div><div id="tab"></div></div>';
  $('main').innerHTML=h.replace('<div class="card">','<div class="card wb">'); wbMount('subj', s.key);
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.classList.toggle('on',b.dataset.t===S.tab); b.onclick=function(){S.tab=b.dataset.t;renderSubject();}; });
  $('bSave').onclick=saveScores;
  $('bPrint').onclick=printPP5;
  $('bCover').onclick=printCover;
  var rel=function(){ var v=s.released===true||String(s.released).toUpperCase()==='TRUE'; $('bRel').textContent=v?'ผู้ปกครองเห็นผลวิชานี้แล้ว (กดเพื่อปิด)':'เปิดให้ผู้ปกครองดูผล'; $('bRel').className=v?'pri':''; return v; };
  rel();
  $('bRel').onclick=function(){
    var now=rel(); if(!now && !confirm('เปิดให้ผู้ปกครองของนักเรียนทุกคนในชั้นนี้เห็นคะแนนและเกรดวิชานี้?')) return;
    api('setReleased',S.token,s.key,!now).then(function(v){ s.released=v; rel(); note($('sMsg'),v?'เปิดให้ผู้ปกครองดูผลแล้ว':'ปิดการแสดงผลแล้ว'); }).catch(function(e){ note($('sMsg'),e.message,true); });
  };
  if(S.tab==='scores') tabScores(); else if(S.tab==='setup') tabSetup(); else tabSum();
}
/* ---- ตั้งช่องคะแนน ---- */
function tabSetup(){
  if(S.cur.subject.kind==='pass'){ $('tab').innerHTML='<p class="mute">รายวิชานี้ประเมินผลเป็น ผ่าน/ไม่ผ่าน (ผ/มผ) ไม่ต้องตั้งช่องคะแนน — ไปที่แท็บ "กรอกคะแนน" เพื่อเลือกผลของนักเรียน</p>'; return; }
  var d=S.cur, h='<p class="mute">เพิ่มช่องคะแนนระหว่างเรียน (เช่น ตัวชี้วัด/หน่วย/ชิ้นงาน) และช่องคะแนนปลายปี/ปลายภาค ระบบจะปรับสัดส่วนให้เป็น '+esc(d.subject.ratioDuring)+':'+esc(d.subject.ratioFinal)+' อัตโนมัติ</p>'
   +'<fieldset style="margin:8px 0;padding:8px"><legend>ตั้งค่ารายวิชา (เหมือนช่องตั้งค่าในไฟล์ Excel)</legend><div class="row">'
   +'<label>ระหว่างเรียน % <input id="stRd" type="number" style="width:70px" value="'+esc(d.subject.ratioDuring)+'"></label>'

/* ---- นำเข้านักเรียนจากไฟล์ (Excel/CSV) ---- */
function colLetter(i){ var s=''; i++; while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function detectMap(aoa){
  var hdr=-1, i, j;
  for(i=0;i<Math.min(aoa.length,15)&&hdr<0;i++){ for(j=0;j<aoa[i].length;j++){ if(/^(ชื่อ|ชื่อ(และ|-)?(นามสกุล|สกุล)|ชื่อนักเรียน|ชื่อตัว|ชื่อ-ชื่อสกุล)$/.test(String(aoa[i][j]).replace(/\s+/g,''))){ hdr=i; break; } } }
  var heads=[], ncol=0; aoa.forEach(function(r){ ncol=Math.max(ncol,r.length); });
  for(j=0;j<ncol;j++) heads.push(hdr>=0 && String(aoa[hdr][j]||'').trim() ? String(aoa[hdr][j]).trim() : 'คอลัมน์ '+colLetter(j));
  var m={no:-1,title:-1,first:-1,last:-1,full:-1};
  heads.forEach(function(h,k){
    var t=h.replace(/\s+/g,'');
    if(m.no<0 && /^(เลขที่|ที่|ลำดับ|no\.?)$/i.test(t)) m.no=k;
    else if(m.title<0 && /คำนำหน้า/.test(t)) m.title=k;
    else if(m.full<0 && /ชื่อ[-–]?(และ)?สกุล|ชื่อ-นามสกุล|ชื่อนามสกุล/.test(t)) m.full=k;
    else if(m.last<0 && /สกุล/.test(t)) m.last=k;
    else if(m.first<0 && /^ชื่อ(ตัว|นักเรียน)?$/.test(t)) m.first=k;
  });
  if(m.full<0 && m.first<0){   // ไม่มีหัวคอลัมน์ชัด: เลือกคอลัมน์แรกที่เป็นข้อความไทยยาว
    for(j=0;j<ncol;j++){ var ok=0,n=0; for(i=hdr+1;i<aoa.length;i++){ var v=String(aoa[i][j]||'').trim(); if(v){ n++; if(/[ก-๙]/.test(v)&&v.length>=5) ok++; } } if(n&&ok/n>0.6){ m.full=j; break; } }
  }
  return {hdr:hdr, heads:heads, map:m};
}
function extractRows(aoa, hdr, m, classLevel){
  var out=[], seq=0;
  for(var i=hdr+1;i<aoa.length;i++){
    var r=aoa[i], g=function(k){ return k>=0 ? String(r[k]==null?'':r[k]).trim() : ''; };
    var name = m.full>=0 ? g(m.full) : (g(m.title)+g(m.first)+' '+g(m.last));
    name=name.replace(/\s+/g,' ').trim();
    if(!name) continue;
    seq++; var no=Number(g(m.no)); if(!(no>0)) no=seq;
    out.push({classLevel:classLevel, no:no, name:name});
  }
  return out;
}
function readTextFile(file){
  return file.arrayBuffer().then(function(buf){
    try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
    catch(e){ return new TextDecoder('windows-874').decode(buf); }   // CSV จาก Excel ภาษาไทยรุ่นเก่า
  });
}

/* พิมพ์ทุกเอกสารเป็น A4 แนวตั้ง · ตารางความกว้างคงที่ ไม่ขยายตามข้อความ */
function fixPrintTables(root){
  [].forEach.call(root.querySelectorAll('table'), function(t){
    if(t.querySelector('colgroup')) return;
    var rows = [].slice.call(t.tBodies.length ? t.tBodies[0].rows : t.rows).filter(function(r){ return !r.querySelector('[colspan]'); });
    if(!rows.length) return;
    var best = rows.reduce(function(a, r){ return r.cells.length > a.cells.length ? r : a; }, rows[0]), n = best.cells.length;
    if(n < 2) return;
    var w = [];
    for(var i=0;i<n;i++){
      var mx = 0; rows.slice(0, 40).forEach(function(r){ var x = r.cells[i]; if(x){ var len = (x.textContent||'').trim().length; if(len > mx) mx = len; } });
      var left = /left/.test((best.cells[i].getAttribute('style')||'')) || best.cells[i].classList.contains('l');
      var hd = t.tHead ? [].map.call(t.tHead.rows, function(r){ return r.cells[i] ? r.cells[i].textContent : ''; }).join(' ') : '';
      var tok = Math.min(7, hd.split(/\s+/).reduce(function(a, x){ return Math.max(a, x.replace(/[()0-9]/g,'').length); }, 0));
      w.push(left ? Math.min(15, Math.max(8, mx * 0.8)) : Math.min(8, Math.max(3.2, mx * 1.1, tok * 0.8)));
    }
    var sum = w.reduce(function(a,b){ return a+b; }, 0);
    var cg = document.createElement('colgroup'); w.forEach(function(x){ var col = document.createElement('col'); col.style.width = (x/sum*100).toFixed(2)+'%'; cg.appendChild(col); });
    t.insertBefore(cg, t.firstChild); t.style.tableLayout = 'fixed'; t.style.width = '100%';
    if(n > 16) t.style.fontSize = n > 28 ? '7pt' : '8.5pt';
  });
}

var RATE_FRAC = 0.6;
function rateOverall(arr, n){
  if(arr.length < n) return '';
  for(var i=0;i<n;i++) if(arr[i]===''||arr[i]==null) return '';
  var min = Math.min.apply(null, arr); if(min < 1) return 0;
  var need = Math.ceil(n*RATE_FRAC), c3 = arr.filter(function(v){return v>=3;}).length, c2 = arr.filter(function(v){return v>=2;}).length;
  if(c3>=need && min>=2) return 3; if(c2>=need) return 2; return 1;
}

function ageMonthsC(birth, date){

  var b = birth.split('-').map(Number), d = date.split('-').map(Number), m = (d[0]-b[0])*12 + (d[1]-b[1]) - (d[2] < b[2] ? 1 : 0);

}

function normDate(v){
  v = String(v).trim(); if(!v) return '';
  var m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m){ var y=Number(m[1]); if(y>2400) y-=543; return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2); }
  m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m){ var y2=Number(m[3]); if(y2>2400) y2-=543; return y2+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2); }
  return v;
}

  var grid = [].map.call(document.querySelectorAll('.xl tbody tr[data-s]'), function(tr){ return [].slice.call(tr.querySelectorAll('input.xc')); });

  var anc = null, foc = null;

/* ---------- ปพ.6 รายบุคคล ---------- */
function pp6Html(r, onlySid){
  var list = r.students.filter(function(s){ return !onlySid || s.studentId === onlySid; }), out = '', nm = r.names || {};
  // อันดับคะแนนรวม (ไม่รวมนักเรียนที่ย้าย/ลาออก)
  var tot = {}; r.students.forEach(function(st){ if(st.status) return; var sm = 0, n = 0; r.subjects.forEach(function(s){ var x = st.results[s.key]; if(s.kind!=='pass' && x && x.total!==null && x.total!==undefined && x.total!==''){ sm += x.total; n++; } }); if(n) tot[st.studentId] = sm; });
  var rankT = function(sid){ if(tot[sid]===undefined) return ''; var rk = 1; Object.keys(tot).forEach(function(k){ if(tot[k] > tot[sid]) rk++; }); return rk; };
  var bd = 'border:1px solid #000;', nRows = Math.max(16, r.subjects.length);
  var activeN = r.students.filter(function(q){ return !q.status; }).length;
  list.forEach(function(st, idx){
    var sumH = 0, sumMax = 0, sumAvg = 0, sumGot = 0, nGot = 0, rows = '';
    for(var i=0;i<nRows;i++){
      var s = r.subjects[i];
      if(!s){ rows += '<tr style="height:5.1mm"><td style="'+bd+'"></td><td style="'+bd+'"></td><td style="'+bd+'"></td><td style="'+bd+'"></td><td style="'+bd+'"></td><td style="'+bd+'"></td><td style="'+bd+'"></td><td style="'+bd+'"></td></tr>'; continue; }
      var x = st.results[s.key] || {}, isP = s.kind==='pass', got = (x.total===null||x.total===undefined||x.total==='') ? null : x.total;
      sumH += Number(s.hours)||0; if(!isP){ sumMax += 100; if(s.avg!==''&&s.avg!=null) sumAvg += Number(s.avg); if(got!==null){ sumGot += got; nGot++; } }
      rows += '<tr style="height:5.1mm;text-align:center"><td style="'+bd+'">'+esc(s.code)+'</td><td style="'+bd+'text-align:left;padding-left:1mm;white-space:nowrap;overflow:hidden">'+esc(s.name)+'</td><td style="'+bd+'">'+esc(s.hours||'')+'</td><td style="'+bd+'">'+(isP?'-':'100.00')+'</td><td style="'+bd+'">'+(isP?'-':(s.avg===''||s.avg==null?'':Number(s.avg).toFixed(2)))+'</td><td style="'+bd+'">'+(isP||got===null?'-':Number(got).toFixed(2))+'</td><td style="'+bd+'">'+esc(gShow(x.grade))+'</td><td style="'+bd+'"></td></tr>';
    }
    var pct = sumMax && nGot ? (sumGot/sumMax*100) : null;
    var actRows = (r.actNames||[]).map(function(n, i){ var v = (st.traits.act.overall||[])[i]; return '<tr style="height:5.1mm"><td style="'+bd+'padding-left:8mm;text-align:left;white-space:nowrap;font-size:11.5pt">'+esc(n)+'</td><td style="'+bd+'text-align:center">'+(v==='ผ'?'ผ่าน':(v==='มผ'?'ไม่ผ่าน':''))+'</td></tr>'; }).join('');
    var lbl = function(t){ return '<td style="'+bd+'font-weight:700;padding-left:1mm;text-align:left;white-space:nowrap;font-size:10.3pt">'+t+'</td>'; }, val = function(v){ return '<td style="'+bd+'text-align:center">'+v+'</td>'; };
    var lv = function(k){ var o = st.traits[k] && st.traits[k].overall; return o===''||o==null ? '' : o; };
    var left = '<table style="width:100%;table-layout:fixed;border-collapse:collapse;font-size:12pt"><colgroup><col style="width:70%"><col style="width:30%"></colgroup>'
      + '<tr style="height:5.1mm">'+lbl('คะแนนคิดเป็นร้อยละ')+val(pct===null?'':pct.toFixed(2))+'</tr><tr style="height:5.1mm">'+lbl('คะแนนรวมได้ลำดับที่')+val(rankT(st.studentId))+'</tr>'
      + '<tr style="height:5.1mm">'+lbl('ผลการเรียนเฉลี่ย')+val(st.gpa===''?'':Number(st.gpa).toFixed(2))+'</tr><tr style="height:5.1mm">'+lbl('ผลการเรียนเฉลี่ยได้ลำดับที่')+val(st.rank)+'</tr>'
      + '<tr style="height:5.1mm"><td colspan="2" style="'+bd+'font-weight:700;padding-left:1mm;text-align:left">ผลการประเมินกิจกรรมพัฒนาผู้เรียน</td></tr>'+actRows
      + '<tr style="height:5.1mm">'+lbl('ผลการประเมินคุณลักษณะอันพึงประสงค์')+val(lv('trait'))+'</tr><tr style="height:5.1mm">'+lbl('ผลการประเมินการอ่าน คิดวิเคราะห์และเขียน')+val(lv('read'))+'</tr>'
      + '<tr style="height:5.1mm">'+lbl('ผลการประเมินค่านิยมหลัก 12 ประการ')+val(lv('value'))+'</tr><tr style="height:5.1mm">'+lbl('ผลการประเมินสมรรถนะสำคัญของผู้เรียน')+val(lv('comp'))+'</tr></table>';
    var sig = function(name, role){ return '<div style="margin:0 0 3mm;text-align:center;font-size:11.5pt;line-height:1.2"><div style="text-align:left">ลงชื่อ<span style="display:inline-block;width:42mm;border-bottom:1px dotted #000">&nbsp;</span></div>'+(name?'('+esc(name)+')<br>':'<br>')+role+'<br>วันที่ ........../........../..........</div>'; };
    var right = sig((r.teachers||[])[0]||'', 'ครูประจำชั้น/ครูที่ปรึกษา') + sig(nm.academic||'', 'หัวหน้างานวิชาการโรงเรียน') + sig(nm.director||'', 'ผู้อำนวยการ'+esc(r.school)) + '<div style="text-align:left;font-size:11.5pt;margin-top:1mm">ลงชื่อ<span style="display:inline-block;width:42mm;border-bottom:1px dotted #000">&nbsp;</span><div style="text-align:center">ผู้ปกครองนักเรียน</div></div>';
    var CG = '<colgroup><col style="width:4.5%"><col style="width:10%"><col style="width:26%"><col style="width:11%"><col style="width:9%"><col style="width:10.5%"><col style="width:9%"><col style="width:9.5%"><col style="width:10.5%"></colgroup>';
    var h = '<div style="'+DOC_FONT+'color:#000;font-size:13pt;border:1.5pt solid #000;box-sizing:border-box;padding:5mm 7mm;height:271mm;overflow:hidden;'+(idx===list.length-1?'':'page-break-after:always;')+'">'
      + '<div style="text-align:center;line-height:1.4"><div style="font-size:15.5pt;font-weight:700;white-space:nowrap">แบบรายงานประจำตัวนักเรียน : ผลการพัฒนาคุณภาพผู้เรียนรายบุคคล (ปพ.6)</div><div style="font-size:15pt;font-weight:700">'+esc(r.school)+' เขตพื้นที่การศึกษาประถมศึกษาสตูล</div><div style="font-size:14pt;font-weight:700">ชั้น'+esc(levelName(r.classLevel))+' ปีการศึกษา '+esc(r.year)+'</div></div>'
      + '<div style="display:flex;align-items:flex-end;gap:3mm;margin:4mm 0 3mm;font-weight:700"><span>ชื่อ-สกุล</span><span style="flex:1;border-bottom:1px dotted #000;text-align:center">'+esc(st.name)+'</span><span>เลขประจำตัว</span>'+dl(st.stuCode||'',24,'font-weight:700')+'<span>เลขที่</span>'+dl(st.no,14,'font-weight:700')+'</div>'
      + '<table style="width:100%;table-layout:fixed;border-collapse:collapse;font-size:12pt">'+CG
      + '<tr style="height:11mm;text-align:center;font-weight:700;font-size:11pt;white-space:normal;line-height:1.1"><td rowspan="'+(nRows+1)+'" style="'+bd+'"><div style="writing-mode:vertical-rl;transform:rotate(180deg);margin:auto;font-size:12pt">ผลการเรียนรายวิชา</div></td><td style="'+bd+'white-space:normal">รหัสวิชา</td><td style="'+bd+'">รายวิชา</td><td style="'+bd+'">เวลาเรียน<br>(ชั่วโมง/ปี)</td><td style="'+bd+'">คะแนน<br>เต็ม</td><td style="'+bd+'">เฉลี่ย<br>ในชั้นเรียน</td><td style="'+bd+'">คะแนน<br>ที่ได้</td><td style="'+bd+'">ผล<br>การเรียน</td><td style="'+bd+'">หมายเหตุ</td></tr>'
      + rows
      + '<tr style="height:5.1mm;text-align:center"><td colspan="3" style="'+bd+'font-weight:700">รวม</td><td style="'+bd+'">'+sumH+'</td><td style="'+bd+'">'+sumMax.toFixed(2)+'</td><td style="'+bd+'">'+(sumAvg?sumAvg.toFixed(2):'')+'</td><td style="'+bd+'">'+(nGot?sumGot.toFixed(2):'')+'</td><td style="'+bd+'"></td><td style="'+bd+'"></td></tr></table>'
      + '<div style="display:flex;gap:0;margin-top:-1px"><div style="flex:0 0 60%">'+left+'</div><div style="flex:1;padding:2mm 0 0 4mm">'+right+'</div></div></div>';
    out += h;
  });
  return out;
}
